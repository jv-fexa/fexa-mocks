/* Font Awesome script build (the stylesheet is blocked by the artifact CSP).
   autoReplaceSvg:"nest" keeps React in control of the <i> it rendered. */
function useFontAwesome() {
  useEffect(() => {
    if (document.getElementById("fa-js")) return;
    window.FontAwesomeConfig = { autoReplaceSvg: "nest", observeMutations: true };
    const s = document.createElement("script");
    s.id = "fa-js";
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js";
    s.async = true;
    document.head.appendChild(s);

}

// ─── COMBO FIELDS (Ext JS combobox look: type-ahead, clear ×, caret) ─────────

const CLIENTS = ["Michaels"];
const FACILITIES = ["E-Corp 0001", "Pitstop 0001"];
const CLASSES = ["Capital Expense", "Found on PM", "Planned Maintenance", "Project", "Reactive Maintenance", "Warranty"];
const PRIORITIES = ["24 Hour", "48 Hour", "Emergency", "Planned", "Same Day", "Within 5 days"];
const CATEGORY_TREE = [
  { label: "Awning", children: ["Cleaning", "Removal", "Repair / Replacement", "Resecure", "Ripped"] },
  { label: "Cleaning", children: ["Carpet", "Post-Construction", "Pressure Washing", "Window Cleaning"] },
  { label: "Door", children: ["Broken Glass", "Closer / Hinge", "Won't Close", "Won't Lock"] },
  { label: "Electrical", children: ["Lighting", "Outlet / Switch", "Power Outage", "Signage"] },
  { label: "Elevator", children: ["Entrapment", "Inspection", "Not Working"] },
  { label: "Extermination/Pest", children: ["Birds", "Insects", "Rodents"] },
  { label: "Fire Protection", children: ["Alarm", "Extinguisher", "Sprinkler"] },
  { label: "Flooring", children: ["Carpet", "Tile", "Vinyl"] },
  { label: "HVAC", children: ["Leak", "Noise", "Not Cooling", "Not Heating"] },
  { label: "Plumbing", children: ["Clog", "Leak", "No Hot Water", "Toilet"] },
  { label: "Roof", children: ["Inspection", "Leak"] },
];

const useOutsideClose = (ref, onClose) => {
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [ref, onClose]);
};

/* Shared shell: label, editable input, clear ×, caret, underline, menu. */
const ComboShell = ({ label, labelStyle, required, value, error, open, setOpen, query, setQuery, onClear, children }) => {
  const ref = React.useRef(null);
  const inputRef = React.useRef(null);
  const close = React.useCallback(() => setOpen(false), [setOpen]);
  useOutsideClose(ref, close);
  const underline = open
    ? `2px solid ${C.linkBlue}`
    : error ? `2px solid ${C.requiredRed}` : `1px solid ${C.fieldUnderline}`;

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <div
        onMouseDown={(e) => {
          if (e.target.closest("[data-clear]")) return;
          if (!open) { setOpen(true); setQuery(value || ""); }
          setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
        }}
        style={{
          position: "relative", paddingBottom: 4, marginTop: 4, minHeight: 58, boxSizing: "border-box",
          borderBottom: underline, cursor: "text",
        }}
      >
        <span style={{ fontSize: 12, color: C.fieldLabel, letterSpacing: 0.1, display: "block", ...labelStyle }}>
          {label}{required && "*"}
        </span>
        <input
          ref={inputRef}
          value={open ? query : (value || "")}
          readOnly={!open}
          onChange={(e) => setQuery(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Escape") setOpen(false); }}
          style={{
            display: "block", width: "100%", boxSizing: "border-box", marginTop: 8,
            border: "none", outline: "none", background: "transparent", padding: "0 48px 0 0",
            fontSize: 14, lineHeight: "18px", color: C.text, fontFamily: "inherit", cursor: "text",
          }}
        />
        {value && (
          <span
            data-clear
            onClick={() => { onClear(); setOpen(false); }}
            title="Clear"
            style={{ position: "absolute", right: 24, bottom: 7, cursor: "pointer", lineHeight: 0 }}
          >
            <Icon cls="fas fa-times" style={{ fontSize: 15, color: "#757575" }} />
          </span>
        )}
        <span
          onMouseDown={(e) => { e.stopPropagation(); setOpen(!open); if (!open) setQuery(value || ""); }}
          style={{ position: "absolute", right: 0, bottom: 7, cursor: "pointer", lineHeight: 0 }}
        >
          <Icon cls="fas fa-caret-down" style={{ fontSize: 14, color: "#757575" }} />
        </span>
      </div>
      {open && (
        <div style={{
          position: "absolute", top: "100%", left: 0, right: 0, zIndex: 100,
          background: "#fff", boxShadow: "0 3px 10px rgba(0,0,0,0.25)",
          maxHeight: 300, overflowY: "auto",
        }}>
          {children}
        </div>
      )}
    </div>
  );
};

const ComboField = ({ label, labelStyle, required, value, onChange, options, error }) => {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [hover, setHover] = useState(null);
  const q = query.trim().toLowerCase();
  const filtering = q && query !== value;
  const shown = filtering ? options.filter((o) => o.toLowerCase().includes(q)) : options;

  return (
    <ComboShell {...{ label, labelStyle, required, value, error, open, setOpen, query, setQuery }} onClear={() => onChange(null)}>
      {shown.length === 0 && <div style={{ padding: "12px 16px", fontSize: 14, color: C.fieldLabel }}>No matches</div>}
      {shown.map((o) => (
        <div
          key={o}
          onMouseEnter={() => setHover(o)}
          onMouseLeave={() => setHover(null)}
          onClick={() => { onChange(o); setOpen(false); }}
          style={{
            height: 40, display: "flex", alignItems: "center", padding: "0 16px",
            fontSize: 14, color: "#212121", cursor: "pointer",
            background: o === value ? "#E0E0E0" : hover === o ? "#EEEEEE" : "#fff",
          }}
        >
          {o}
        </div>
      ))}
    </ComboShell>
  );
};

/* Category is a two-level tree: parents expand, children are picked and the
   value reads "Parent > Child". Typing filters across both levels. */
const CategoryCombo = ({ value, onChange }) => {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [hover, setHover] = useState(null);
  const [expanded, setExpanded] = useState({});
  const [selParent] = (value || "").split(" > ");

  const openAndSeed = (v) => {
    setOpen(v);
    if (v && selParent) setExpanded((e) => ({ ...e, [selParent]: true }));
  };

  const q = query.trim().toLowerCase();
  const filtering = q && query !== value;
  const tree = filtering
    ? CATEGORY_TREE
        .map((p) => ({
          ...p,
          children: p.label.toLowerCase().includes(q) ? p.children : p.children.filter((c) => c.toLowerCase().includes(q)),
        }))
        .filter((p) => p.children.length)
    : CATEGORY_TREE;

  const row = { height: 26, display: "flex", alignItems: "center", fontSize: 14, color: "#212121", cursor: "pointer" };

  return (
    <ComboShell
      label="Category" required value={value} open={open} setOpen={openAndSeed}
      query={query} setQuery={setQuery} onClear={() => onChange(null)}
    >
      {tree.length === 0 && <div style={{ padding: "12px 16px", fontSize: 14, color: C.fieldLabel }}>No matches</div>}
      {tree.map((p) => {
        const isOpen = filtering || expanded[p.label];
        return (
          <div key={p.label}>
            <div
              onClick={() => setExpanded({ ...expanded, [p.label]: !expanded[p.label] })}
              onMouseEnter={() => setHover(p.label)}
              onMouseLeave={() => setHover(null)}
              style={{ ...row, background: hover === p.label ? "#F2F5F6" : "#fff" }}
            >
              <span style={{ width: 48, display: "flex", justifyContent: "center", flexShrink: 0 }}>
                <Icon cls={isOpen ? "fas fa-chevron-up" : "fas fa-chevron-down"} style={{ fontSize: 11, color: "#212121" }} />
              </span>
              <span style={{ paddingLeft: 20 }}>{p.label}</span>
            </div>
            {isOpen && p.children.map((c) => {
              const full = `${p.label} > ${c}`;
              return (
                <div
                  key={c}
                  onClick={() => { onChange(full); setOpen(false); }}
                  onMouseEnter={() => setHover(full)}
                  onMouseLeave={() => setHover(null)}
                  style={{
                    ...row, paddingLeft: 92,
                    background: full === value ? "#E1E9ED" : hover === full ? "#F2F5F6" : "#fff",
                  }}
                >
                  {c}
                </div>
              );
            })}
          </div>
        );
      })}
    </ComboShell>
  );
};

/* Measured from the live app: panel headers on very-light-grey with a grey

const G = {

  divider: "#E2E2E2",
  headerRule: "#E0E0E0",
  text: "#212121",
  headerText: "#343434",
  title: "#6E6E6E",
  muted: "#757575",
  icon: "#9E9E9E",
  vividBlue: "#21B8BF",
  tangerine: "#F58D23",
  brightGreen: "#89C826",
  alertRed: "#F44336",

};

/* Custom radio: a visually hidden native input (keeps keyboard + screen
   reader behaviour) drawn as a charcoal ring. Focus ring is charcoal, 2px
   with a 2px gap, replacing the browser's blue outline. */
const RADIO_CSS = `
.fz-radio-input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.fz-radio-input:focus-visible + .fz-radio { box-shadow: 0 0 0 2px #fff, 0 0 0 4px ${W.charcoal}; }
`;

const Radio = ({ checked }) => (
  <span className="fz-radio" style={{
    width: 18, height: 18, borderRadius: "50%", boxSizing: "border-box", flexShrink: 0, marginTop: 0,
    border: `2px solid ${checked ? W.charcoal : W.radioOff}`, background: "#fff",
    display: "inline-flex", alignItems: "center", justifyContent: "center",
  }}>
    {checked && <span style={{ width: 8, height: 8, borderRadius: "50%", background: W.charcoal }} />}
  </span>
);

/* One radio row: a matching work order, or the "new issue" option. */
const ChoiceRow = ({ checked, onChoose, children }) => (
  <label style={{
    position: "relative", display: "flex", alignItems: "flex-start", gap: 10, padding: "8px 10px", cursor: "pointer",
    background: checked ? "#fff" : "transparent",

  }}>
    <input
      className="fz-radio-input" type="radio" name="duplicate-choice" checked={checked} onChange={onChoose}
    />
    <Radio checked={checked} />
    <span style={{ fontSize: 13, lineHeight: "18px", color: G.text, minWidth: 0 }}>{children}</span>
  </label>
);

/* Matches arrive newest first; only the first 3 show until "Show all" is
   clicked. A chosen match below the fold stays visible after collapsing. */
const MATCH_LIMIT = 3;
const MatchList = ({ matches, choice, onChoose, onOpen }) => {
  const [showAll, setShowAll] = useState(false);
  const extra = matches.length - MATCH_LIMIT;
  let shown = showAll || extra <= 0 ? matches : matches.slice(0, MATCH_LIMIT);
  if (!shown.some((m) => m.id === choice)) {
    const p = matches.find((m) => m.id === choice);
    if (p) shown = [...shown, p];
  }
  return (
    <>
      {shown.map((m) => (
        <ChoiceRow key={m.id} checked={choice === m.id} onChoose={() => onChoose(m.id)}>
          <a
            href="#"
            title={`Open Work Order #${m.id}`}
            onClick={(e) => { e.preventDefault(); e.stopPropagation(); onOpen(m.id); }}
            style={{ fontWeight: 600, color: G.vividBlue, textDecoration: "underline" }}
          >
            WO #{m.id}
          </a>{" "}
          · {m.status} · {m.priority} · created {m.age} ago
          <span style={{ display: "block", color: G.muted }}>{m.description}</span>
        </ChoiceRow>
      ))}
      {extra > 0 && (
        <a
          href="#"
          onClick={(e) => { e.preventDefault(); setShowAll(!showAll); }}
          style={{ color: G.vividBlue, textDecoration: "none", fontSize: 13, padding: "2px 10px 4px", alignSelf: "flex-start" }}
        >
          {showAll ? "Show fewer" : `Show all ${matches.length}`}
        </a>
      )}
    </>
  );
};

const openSummary = (form, matches) =>
  matches.length === 1
    ? `WO #${matches[0].id} is already open at ${form.facility} for ${form.category}.`
    : `${matches.length} work orders are already open at ${form.facility} for ${form.category}.`;

/* Recent work at the facility for the same category (potential recalls), as radio options in the
   same group as the duplicates. Picking one means "this problem came back":
   no new work order is created and that work order's status becomes Recall.
   Newest first; 3 shown until "Show all". A chosen one below the fold stays
   visible after collapsing. */
const RecallList = ({ recalls, choice, onChoose, onOpen }) => {
  const [showAll, setShowAll] = useState(false);
  const extra = recalls.length - MATCH_LIMIT;
  let shown = showAll || extra <= 0 ? recalls : recalls.slice(0, MATCH_LIMIT);
  if (!shown.some((m) => m.id === choice)) {
    const p = recalls.find((m) => m.id === choice);
    if (p) shown = [...shown, p];
  }
  return (
    <>
      {shown.map((m) => (
        <ChoiceRow key={m.id} checked={choice === m.id} onChoose={() => onChoose(m.id)}>
          <a
            href="#"
            title={`Open Work Order #${m.id}`}
            onClick={(e) => { e.preventDefault(); e.stopPropagation(); onOpen(m.id); }}
            style={{ fontWeight: 600, color: G.vividBlue, textDecoration: "underline" }}
          >
            WO #{m.id}
          </a>{" "}
          · {m.status} · {m.priority} · created {m.created.slice(4, 10)} ({m.age} ago)
          <span style={{ display: "block", color: G.muted }}>{m.description}</span>
        </ChoiceRow>
      ))}
      {extra > 0 && (
        <a
          href="#"
          onClick={(e) => { e.preventDefault(); setShowAll(!showAll); }}
          style={{ color: G.vividBlue, textDecoration: "none", fontSize: 13, padding: "2px 10px 4px", alignSelf: "flex-start" }}
        >
          {showAll ? "Show fewer" : `Show all ${recalls.length}`}
        </a>
      )}
    </>
  );
};

const SectionTitle = ({ title, sub }) => (
  <div style={{ padding: "0 0 2px" }}>
    <div style={{ fontSize: 14, fontWeight: 600, color: G.text }}>{title}</div>
    {sub && <div style={{ fontSize: 13, lineHeight: "18px", color: G.text, marginTop: 3 }}>{sub}</div>}
  </div>
);

/* Duplicate and recall check under Category. One radio group:
   - a possible duplicate  → add your details to it
   - a recent work order    → mark it as a recall (status becomes Recall)
   - "No, this is a new issue" → create as usual
   The answer can be cleared. Saving without an answer turns the box red.
   Warning variant of the DS Callout: 2px fugly-yellow border on the
   proposed warning-tint; the error state is the DS error Callout. */
const DuplicateCallout = React.forwardRef(({ form, matches, recalls = [], choice, onChoose, onOpen, error }, ref) => {
  const one = matches.length === 1;
  const hasDup = matches.length > 0;
  const hasRecall = recalls.length > 0;
  const border = error ? G.alertRed : W.amber;
  const kind = !choice || choice === "new" ? choice : (matches.some((m) => m.id === choice) ? "add" : "recall");
  const divider = <div style={{ height: 1, background: "rgba(0,0,0,0.1)", margin: "10px 0" }} />;

  return (
    <div ref={ref} style={{
      marginTop: 12, padding: 12, background: error ? W.errorTint : W.warningTint,
      border: `2px solid ${border}`, scrollMarginTop: 16,
    }}>
      <style>{RADIO_CSS}</style>
      <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
        <Icon cls="fas fa-exclamation-triangle" style={{ fontSize: 15, color: border, marginTop: 1 }} />
        <div style={{ flex: 1, minWidth: 0 }}>
          {hasDup && (
            <>
              <SectionTitle
                title={`Possible duplicate${one ? "" : "s"}`}
                sub={<>{openSummary(form, matches)} {one ? "Is your request the same issue?" : "Is your request the same issue as one of these?"}</>}
              />
              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 8 }}>
                <MatchList matches={matches} choice={choice} onChoose={onChoose} onOpen={onOpen} />
              </div>
            </>
          )}

          {hasDup && hasRecall && divider}

          {hasRecall && (
            <>
              <SectionTitle
                title="Possible recalls"
                sub={`Recent work at ${form.facility} for ${form.category} in the last 60 days. Is this a problem coming back after one of these?`}
              />
              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 8 }}>
                <RecallList recalls={recalls} choice={choice} onChoose={onChoose} onOpen={onOpen} />
              </div>
            </>
          )}

          {divider}
          <ChoiceRow checked={choice === "new"} onChoose={() => onChoose("new")}>
            <strong style={{ fontWeight: 600 }}>No, this is a new issue</strong>
            <span style={{ display: "block", color: G.muted }}>Create a new work order as usual.</span>
          </ChoiceRow>

          {error && !choice && (
            <div style={{ fontSize: 12, color: G.alertRed, marginTop: 6 }}>
              Choose a work order, or say this is a new issue.
            </div>
          )}
          {!error && !choice && (
            <div style={{ fontSize: 12, lineHeight: "17px", color: G.muted, marginTop: 6 }}>
              {hasDup && "Same issue: your description and photos are added to that work order. "}
              {hasRecall && "Recall: that work order's status changes to Recall. "}
              No new work order is created either way.
            </div>
          )}
          {kind === "add" && (
            <div style={{ fontSize: 13, lineHeight: "18px", color: G.text, marginTop: 8 }}>
              <strong style={{ fontWeight: 600 }}>No new work order will be created.</strong>{" "}
              When you save, your description and photos are added to WO #{choice}. Other fields are locked.
            </div>
          )}
          {kind === "recall" && (
            <div style={{ fontSize: 13, lineHeight: "18px", color: G.text, marginTop: 8 }}>
              <strong style={{ fontWeight: 600 }}>No new work order will be created.</strong>{" "}
              When you save, WO #{choice}'s status changes to Recall and your description and photos are added to it.
              Other fields are locked.
            </div>
          )}
          {kind === "new" && (
            <div style={{ fontSize: 13, lineHeight: "18px", color: G.text, marginTop: 8 }}>
              A new work order will be created when you save.
            </div>
          )}
          {choice && (
            <a
              href="#"
              onClick={(e) => { e.preventDefault(); onChoose(null); }}
              style={{ display: "inline-block", marginTop: 6, fontSize: 13, color: G.vividBlue, textDecoration: "none" }}
            >
              Clear selection
            </a>
          )}
        </div>
      </div>
    </div>
  );
});

      { key: "type", text: "What type of issue are you experiencing?", options: ["Backup", "Leak", "No Water", "Other"] },

  questions: [
    { key: "hazard", text: "Is the awning a safety hazard right now (sagging, loose, or blocking an entrance)?", options: ["Yes", "No"] },

  if (!category) return null;
  const parent = category.split(" > ")[0];

              <ComboField
                label={q.text}
                labelStyle={{ fontSize: 15, lineHeight: "20px", color: C.text, letterSpacing: 0 }}
                options={q.options}
                value={answers[q.key] || null}
                onChange={(v) => setAnswers((a) => ({ ...a, [q.key]: v }))}
                error={tried && !answers[q.key]}
              />
              {tried && !answers[q.key] && (
                <div style={{ fontSize: 12, color: G.alertRed, marginTop: 4 }}>Choose an answer.</div>
              )}
            </div>
          ))}
        </div>
        {addTo && (
          <div style={{
            margin: "0 16px 16px", padding: "10px 12px", background: "#F6F6F6",
            fontSize: 13, lineHeight: "18px", color: C.text, display: "flex", gap: 10,
          }}>
            <Icon cls="fas fa-info-circle" style={{ fontSize: 14, color: "#757575", marginTop: 2 }} />
            <span>
              <strong style={{ fontWeight: 600 }}>No new work order will be created.</strong>{" "}
              {addKind === "recall"
                ? <>WO #{addTo.id}'s status changes to Recall, and your description and photos are added to it. </>
                : <>Your description and photos will be added to WO #{addTo.id}. </>}
              Its priority stays {addTo.priority}, and {(WO_EXTRA[addTo.id] || DEFAULT_EXTRA).vendor} is notified
              {addKind === "recall" ? " of the recall." : " that the description changed."}
            </span>
          </div>
        )}
        <div style={{ background: "#F4F4F4", display: "flex", justifyContent: "flex-end", gap: 2, padding: 8 }}>
          <ActionButton color={G.alertRed} hoverColor="#D32F2F" onClick={onCallAvoided}>Call avoided</ActionButton>
          <ActionButton
            disabled={saving}
            onClick={() => { setTried(true); if (!unanswered.length) onSave(answers); }}
          >
            {addTo
              ? (saving ? "Saving…" : addKind === "recall" ? `Recall WO #${addTo.id}` : `Add to WO #${addTo.id}`)
              : "Save work order"}
          </ActionButton>
        </div>
      </div>
    </div>
  );
};

// ─── PROTOTYPE SETTINGS (not part of production) ─────────────────────────────

const PRESETS = [
  {
    key: "one",
    title: "Flow 1: One duplicate",
    note: "Duplicate WO #619, plus 1 possible recall. Pick one, then save.",
    form: {
      client: "Michaels", facility: "E-Corp 0001", cls: "Reactive Maintenance",
      category: "Awning > Cleaning", priority: "48 Hour",
      description: "Awning over the main entrance is covered in bird droppings. Customers are complaining.",
      photos: ["photo-1.jpg"],
    },
  },
  {
    key: "five",
    title: "Flow 2: Five duplicates",
    note: "Duplicates WO #621, #617, #609, #598, #584, plus 2 possible recalls. Pick one, then save.",
    form: {
      client: "Michaels", facility: "E-Corp 0001", cls: "Reactive Maintenance",
      category: "Electrical > Lighting", priority: "24 Hour",
      description: "Second fixture by the stockroom door is flickering too.",
      photos: ["photo-1.jpg", "photo-2.jpg"],
    },
  },
  {
    key: "ca-dup",
    title: "Flow 3: Plumbing, new issue",
    note: "Duplicate WO #615, plus 2 possible recalls. Choose any option, then save.",
    form: {
      client: "Michaels", facility: "Pitstop 0001", cls: "Reactive Maintenance",
      category: "Plumbing > Clog", priority: "24 Hour",
      description: "Sink in the employee breakroom is draining very slowly.",
      photos: [],
    },
  },
  {
    key: "ca-none",
    title: "Flow 4: Plumbing, no duplicates",
    note: "No duplicates; 2 possible recalls. Pick one to mark it as a recall, then save.",
    form: {
      client: "Michaels", facility: "Pitstop 0001", cls: "Reactive Maintenance",
      category: "Plumbing > Leak", priority: "48 Hour",
      description: "Water pooling under the sink in the front restroom.",
      photos: [],
    },
  },
];

const PrototypeSettings = ({ onLoad, onReset }) => {
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);
  const close = React.useCallback(() => setOpen(false), []);
  useOutsideClose(ref, close);

  const Line = ({ k, v }) => (
    <div style={{ display: "flex", gap: 8, fontSize: 12, lineHeight: "17px" }}>
      <span style={{ width: 72, flexShrink: 0, color: "#8A97A0" }}>{k}</span>
      <span style={{ color: "#1E2A32", minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{v}</span>
    </div>
  );

  return (
    <div ref={ref} style={{ position: "fixed", left: 16, bottom: 16, zIndex: 600, fontFamily: "Roboto, sans-serif" }}>
      {open && (
        <div style={{
          position: "absolute", left: 0, bottom: 48, width: 320, background: "#fff", borderRadius: 10,
          boxShadow: "0 10px 30px rgba(0,0,0,0.25)", overflowY: "auto", maxHeight: "calc(100vh - 90px)",
        }}>
          <div style={{ background: "#1E2A32", color: "#fff", padding: "12px 14px", display: "flex", alignItems: "center", gap: 8 }}>
            <Icon cls="fas fa-flask" style={{ fontSize: 13, color: "#F58D23" }} />
            <span style={{ fontSize: 14, fontWeight: 600 }}>Prototype Settings</span>
            <div style={{ flex: 1 }} />
            <span onClick={close} style={{ cursor: "pointer", lineHeight: 0 }}>
              <Icon cls="fas fa-times" style={{ fontSize: 13, color: "#9FB2BD" }} />
            </span>
          </div>
          <div style={{ padding: "10px 14px 4px", fontSize: 12, color: "#8A97A0" }}>
            Not part of production. Each flow fills the form and opens its duplicate check.
          </div>
          <div style={{ padding: "6px 14px 14px", display: "flex", flexDirection: "column", gap: 10 }}>
            {PRESETS.map((p) => (
              <div key={p.key} style={{ border: "1px solid #E1E9ED", borderRadius: 8, padding: 12 }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                  <span style={{ fontSize: 14, fontWeight: 600, color: "#1E2A32" }}>{p.title}</span>
                </div>
                <div style={{ fontSize: 12, color: "#5A6B75", margin: "2px 0 8px" }}>{p.note}</div>
                <Line k="Facility" v={p.form.facility} />
                <Line k="Class" v={p.form.cls} />
                <Line k="Category" v={p.form.category} />
                <Line k="Priority" v={p.form.priority} />
                <Line k="Description" v={p.form.description} />
                <Line k="Photos" v={p.form.photos.join(", ")} />
                <button
                  onClick={() => { onLoad(p.form); close(); }}
                  style={{
                    marginTop: 10, width: "100%", padding: "8px 0", border: "none", borderRadius: 6,
                    background: "#1E2A32", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer",
                    fontFamily: "inherit",
                  }}
                >
                  Load this flow
                </button>
              </div>
            ))}
            <button
              onClick={() => { onReset(); close(); }}
              style={{
                padding: "8px 0", border: "1px solid #C9D3D9", borderRadius: 6, background: "#fff",
                color: "#1E2A32", fontSize: 13, cursor: "pointer", fontFamily: "inherit",
              }}
            >
              Reset to empty form
            </button>
          </div>
        </div>
      )}
      <button
        onClick={() => setOpen(!open)}
        style={{
          display: "flex", alignItems: "center", gap: 8, padding: "9px 14px", borderRadius: 22, border: "none",
          background: "#1E2A32", color: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer",
          boxShadow: "0 4px 14px rgba(0,0,0,0.28)", fontFamily: "inherit",
        }}
      >
        <Icon cls="fas fa-flask" style={{ fontSize: 13, color: "#F58D23" }} />
        Prototype Settings
        <Icon cls={open ? "fas fa-chevron-down" : "fas fa-chevron-up"} style={{ fontSize: 10, color: "#9FB2BD" }} />
      </button>
    </div>
  );
};

// ─── PAGE ────────────────────────────────────────────────────────────────────

function App() {
  useFontAwesome();
  const [capitalExpense, setCapitalExpense] = useState(false);
  const [noDefaultVendor, setNoDefaultVendor] = useState(false);
  const [callAvoided, setCallAvoided] = useState(false);
  const [showInstructions, setShowInstructions] = useState(true);
  const blankForm = { client: "Michaels", facility: null, cls: null, category: null, priority: null, description: "", photos: [] };
  const [form, setForm] = useState(blankForm);
  const set = (k) => (v) => setForm((f) => ({ ...f, [k]: v }));

  // Duplicate handling
  const matches = findDuplicates(form);
  const recalls = findRecalls(form);
  // null = not answered yet, "new" = a new issue, otherwise the id of the work order to add to
  const [choice, setChoice] = useState(null);
  const [dupError, setDupError] = useState(false);
  const [confirmOpen, setConfirmOpen] = useState(false);
  const [saving, setSaving] = useState(false);
  const [view, setView] = useState("create"); // "create" | "wo" (after adding) | "peek" (opened from the warning)
  const [peekWo, setPeekWo] = useState(null);
  const [callAvoidOpen, setCallAvoidOpen] = useState(false);
  const [addedWo, setAddedWo] = useState(null);
  const [toast, setToast] = useState(null);
  const [formKey, setFormKey] = useState(0);
  const clearToast = React.useCallback(() => setToast(null), []);
  const calloutRef = React.useRef(null);

  // A new facility/category pair is a new question: clear the answer.
  useEffect(() => {
    setChoice(null);
    setDupError(false);
  }, [form.facility, form.category]);

  const choose = (c) => { setChoice(c); setDupError(false); };

  const linkedWo = choice && choice !== "new"
    ? (EXISTING_WOS.find((w) => w.id === choice) || RECENT_WOS.find((w) => w.id === choice))
    : null;
  const linked = !!linkedWo;
  // "add" = add details to a duplicate; "recall" = mark a recent work order as a recall
  const linkKind = linked ? (matches.some((m) => m.id === choice) ? "add" : "recall") : null;
  const hasDescription = form.description.trim().length > 0;

  const nowLabel = () => {
    const d = new Date();
    return d.toLocaleDateString("en-US") + " " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  };

  const addToExisting = () => {
    setSaving(true);
    setTimeout(() => {
      const extra = WO_EXTRA[linkedWo.id] || DEFAULT_EXTRA;
      setAddedWo({
        ...linkedWo, ...extra,
        ...(linkKind === "recall" ? { status: "Recall" } : {}),
        additions: [{ by: "Jose Quevedo", at: nowLabel(), text: form.description.trim() }],
        photos: [...extra.photos, ...form.photos],
        newPhotos: form.photos.length,
      });
      setSaving(false);
      setConfirmOpen(false);
      setCallAvoidOpen(false);
      setView("wo");
      setToast(linkKind === "recall"
        ? `Work Order #${linkedWo.id} was marked as a recall. No new work order was created.`
        : `Your details were added to Work Order #${linkedWo.id}. No new work order was created.`);
    }, 700);
  };

  const missing = [
    ["Client", form.client], ["Facility", form.facility], ["Class", form.cls],
    ["Category", form.category], ["Priority", form.priority], ["Description", hasDescription],
  ].filter(([, v]) => !v).map(([k]) => k);

  /* Save:
     - match found, no answer yet → the duplicate box turns red and scrolls into view
     - added to an existing work order → needs a description, then a confirmation
     - new issue, or no match → normal required-field check, then create */
  const closeCallAvoid = React.useCallback(() => setCallAvoidOpen(false), []);

  const createWorkOrder = () => {
    setCallAvoidOpen(false);
    setToast("Work Order #625 created");
    resetForm();
  };

  // PENDING (Molly): what CALL AVOIDED does today. Prototype: discard and confirm.
  const markCallAvoided = () => {
    setCallAvoidOpen(false);
    setToast("Call avoided. No work order was created.");
    resetForm();
  };

  /* Opening a match from the warning: the work order opens in its own tab and
     the form keeps everything entered, so the user can come back and choose. */
  const openWo = (id) => {
    const w = EXISTING_WOS.find((x) => x.id === id) || RECENT_WOS.find((x) => x.id === id);
    const extra = WO_EXTRA[id] || DEFAULT_EXTRA;
    setPeekWo({ ...w, ...extra, additions: [], newPhotos: 0 });
    setView("peek");
  };

  const save = () => {
    if ((matches.length || recalls.length) && !choice) {
      setDupError(true);
      if (calloutRef.current) calloutRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (linked) {
      if (!hasDescription) { setToast("Fill in the required fields: Description"); return; }
      setCallAvoidOpen(true);
      return;
    }
    if (missing.length) { setToast(`Fill in the required fields: ${missing.join(", ")}`); return; }
    setCallAvoidOpen(true);
  };

  const resetForm = () => {
    setForm(blankForm);
    setChoice(null);
    setDupError(false);
    setPeekWo(null);
    setFormKey((k) => k + 1);
  };

  /* Prototype settings: fill the form with a flow's values, then bring the
     duplicate check into view. */
  const loadPreset = (values) => {
    setForm({ ...blankForm, ...values });
    setChoice(null);
    setDupError(false);
    setConfirmOpen(false);
    setCallAvoidOpen(false);
    setAddedWo(null);
    setPeekWo(null);
    setView("create");
    setFormKey((k) => k + 1);
    setTimeout(() => {
      if (calloutRef.current) calloutRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 150);
  };

  const startOver = () => {
    resetForm();
    setAddedWo(null);
    setView("create");
  };

  const tabs = view === "wo"
    ? [{ key: "list", label: "Work Orders" }, { key: "114695", label: "Work Order # 114695" }, { key: "wo", label: `Work Order # ${addedWo.id}` }]
    : [
        { key: "list", label: "Work Orders" }, { key: "create", label: "Create Work Order" },
        ...(peekWo ? [{ key: "peek", label: `Work Order # ${peekWo.id}` }] : []),
      ];

  return (
    <div style={{
      display: "flex", height: "100vh", overflow: "hidden", background: "#fff",
      fontFamily: "Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
    }}>
      <Sidebar />
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <TopBar />
        <TabBar
          tabs={tabs}
          active={view}
          onSelect={(k) => { if (k === "create" || (k === "peek" && peekWo)) setView(k); }}
        />

        {view === "wo" || view === "peek" ? (
          <WorkOrderOverviewPage wo={view === "wo" ? addedWo : peekWo} />
        ) : (
        <React.Fragment key={formKey}>
        {/* Title band */}
        <div style={{
          background: C.titleBandBg, padding: "18px 24px 14px", flexShrink: 0,
          display: "flex", alignItems: "center",
        }}>
          <span style={{ fontSize: 22, color: "#5f6b70" }}>Create Work Order</span>
          <div style={{ flex: 1 }} />
          <button onClick={save} title="Save" style={{ background: "none", border: "none", cursor: "pointer", color: C.saveBtn, padding: 0 }}>
            <Icon cls="far fa-save" style={{ fontSize: 26 }} />
          </button>
        </div>

        <main style={{ flex: 1, overflow: "auto" }}>
          <div style={{
            display: "grid", gridTemplateColumns: "1fr 1fr 1fr", columnGap: 60,
            padding: "8px 24px 36px", alignItems: "start",
          }}>
            {/* LEFT */}
            <div>
              <ComboField label="Client" required options={CLIENTS} value={form.client} onChange={set("client")} />
              <Gap h={8} />
              <ComboField label="Facility" required options={FACILITIES} value={form.facility} onChange={set("facility")} error={!form.facility} />
              <Gap h={34} />
              <ComboField label="Class" required options={CLASSES} value={form.cls} onChange={set("cls")} />
              <Gap h={34} />
              <CategoryCombo value={form.category} onChange={set("category")} />
              {(matches.length > 0 || recalls.length > 0) && (
                <DuplicateCallout
                  ref={calloutRef} form={form} matches={matches} recalls={recalls}
                  choice={choice} onChoose={choose} onOpen={openWo} error={dupError}
                />
              )}
              <Locked on={linked}>
                <Gap h={34} />
                <Field label="Area" select />
                <Gap h={34} />
                <Field label="Asset" select />
                <Gap h={26} />
                <div style={{ paddingTop: 8, minHeight: 44 }}>
                  <div style={{ fontSize: 12, color: C.fieldLabel, marginBottom: 8 }}>Capital Expense</div>
                  <Toggle on={capitalExpense} onChange={() => setCapitalExpense(!capitalExpense)} />
                </div>
              </Locked>
            </div>

            {/* MIDDLE */}
            <div>
              <DescriptionField value={form.description} onChange={set("description")} />
              <PhotosField photos={form.photos} onChange={set("photos")} />
              <Gap h={34} />
              {linked ? (
                <>
                  <Locked on>
                    <Field label="Priority" required select value={linkedWo.priority} />
                  </Locked>
                  <div style={{ fontSize: 12, color: G.muted, marginTop: 6 }}>
                    Kept from WO #{linkedWo.id}. Priority can't be changed when adding details.
                  </div>
                </>
              ) : (
                <ComboField label="Priority" required options={PRIORITIES} value={form.priority} onChange={set("priority")} />
              )}
              <Locked on={linked}>
                <Gap h={30} />
                <Field label="Assignee" select />
                <Gap h={30} />
                <Field label="Responsible Party" select />
                <Gap h={30} />
                <Field label="Responsible Party Threshold" />
                <Gap h={30} />
                <Field label="PO Number" />
              </Locked>
            </div>

            {/* RIGHT */}
            <Locked on={linked}>
              <Gap h={4} />
              <EtaRow />

              <div style={{ display: "flex", gap: 60, marginTop: 26 }}>
                <div>
                  <div style={{ fontSize: 14, color: C.text, marginBottom: 10 }}>Do Not Assign Default Vendor</div>
                  <Toggle on={noDefaultVendor} onChange={() => setNoDefaultVendor(!noDefaultVendor)} />
                </div>
                <div>
                  <div style={{ fontSize: 14, color: C.text, marginBottom: 10 }}>Call Avoided</div>
                  <Toggle on={callAvoided} onChange={() => setCallAvoided(!callAvoided)} />
                </div>
              </div>

              <div
                onClick={() => setShowInstructions(!showInstructions)}
                style={{ marginTop: 22, display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}
              >
                <span style={{ fontSize: 14, fontWeight: 700, color: C.linkBlue, textDecoration: "underline" }}>
                  {showInstructions ? "Hide Instructions" : "Show Instructions"}
                </span>
                <Icon cls={showInstructions ? "fas fa-caret-up" : "fas fa-caret-down"} style={{ fontSize: 13, color: C.linkBlue }} />
              </div>

              {showInstructions && (
                <>
                  <TallField label="IVR Instructions" height={170} />
                  <TallField label="Special Instructions" height={190} />
                </>
              )}

              <Gap h={30} />
              <Field label="CAN" select />
              <Gap h={30} />
              <Field label="Label" />
            </Locked>
          </div>

          <WorkOrderGrids form={form} linkedId={linked ? linkedWo.id : null} />
        </main>
        </React.Fragment>
        )}
      </div>

      {false && confirmOpen && linked && ( /* replaced by the call avoidance modal's add mode */
        <ConfirmAddDialog
          wo={linkedWo} form={form} saving={saving}
          onBack={() => setConfirmOpen(false)} onConfirm={addToExisting}
        />
      )}
      {callAvoidOpen && callAvoidanceFor(form.category) && (
        <CallAvoidanceDialog
          config={callAvoidanceFor(form.category)}
          onCallAvoided={markCallAvoided}
          addTo={linkedWo}
          addKind={linkKind}
          saving={saving}
          onSave={linked ? addToExisting : createWorkOrder}
          onClose={closeCallAvoid}
        />
      )}
      {toast && <Toast text={toast} onDone={clearToast} />}
      <PrototypeSettings onLoad={loadPreset} onReset={startOver} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
